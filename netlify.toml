[build]
  publish = "."

[[headers]]
  for = "/models/*.glb"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "model/gltf-binary"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/references/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
